name: CI (Tests & Compilation PDF)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 📦 Installation des dépendances et de Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu

      - name: 🛡️ Tests QualityGuard
        run: python -m unittest -v tests/test_validation.py

      - name: 📄 Compilation PDF de contrôle (CV et lettre sur une page A4)
        run: |
          mkdir -p "$RUNNER_TEMP/pdf"
          cp test_cv.html "$RUNNER_TEMP/pdf/cv.html"
          cp test_letter.html "$RUNNER_TEMP/pdf/letter.html"
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "src")
          from pdf_compiler import compile_html_to_pdf, get_pdf_page_count, get_browser_path
          out = os.path.join(os.environ["RUNNER_TEMP"], "pdf")
          print("Navigateur :", get_browser_path())
          errors = []
          for name in ("cv", "letter"):
              html = os.path.join(out, f"{name}.html")
              pdf = os.path.join(out, f"{name}.pdf")
              ok = compile_html_to_pdf(html, pdf)
              pages = get_pdf_page_count(pdf) if ok else 0
              print(f"{name}: ok={ok} pages={pages}")
              if not ok or pages != 1:
                  errors.append(name)
          if errors:
              sys.exit(f"Compilation PDF en échec ou hors format 1 page : {errors}")
          PY
