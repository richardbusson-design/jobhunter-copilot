name: JobHunter Copilot Cloud (Recherche & Candidatures 24h/24)

on:
  schedule:
    # Exécution automatique tous les jours à 07h00, 12h00 et 17h00 UTC (09h, 14h, 19h heure de Paris)
    - cron: '15 7,12,17 * * *'
  workflow_dispatch: # Permet aussi de déclencher manuellement le robot depuis un smartphone ou un navigateur

permissions:
  contents: write # Autorisation d'écriture sur le dépôt pour mettre à jour dashboard.md

jobs:
  jobhunter-run:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installation des dépendances et de Playwright / Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu

      - name: 🛡️ Exécution des Tests de Sécurité QualityGuard
        run: |
          python -m unittest tests/test_validation.py

      - name: 🚀 Lancement du Pipeline JobHunter Cloud (Recherche & Candidatures Automatiques)
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          FRANCE_TRAVAIL_USER: ${{ secrets.FRANCE_TRAVAIL_USER }}
          FRANCE_TRAVAIL_PASSWORD: ${{ secrets.FRANCE_TRAVAIL_PASSWORD }}
        run: |
          python src/cloud_runner.py

      - name: 💾 Sauvegarde & Publication du Tableau de Bord
        run: |
          git config --global user.name "JobHunter Cloud Bot"
          git config --global user.email "bot@kairos-paye.fr"
          git pull --rebase origin main || echo "Pas de rebase nécessaire"
          git add candidatures/ tracker.json dashboard.md README.md
          git commit -m "🤖 [Cloud Bot] Mise à jour du Tableau de Bord & Candidatures $(date +'%Y-%m-%d %H:%M')" || echo "Aucune modification à commiter"
          git push origin main || echo "Échec du push"

      - name: 📎 Sauvegarde des Fichiers PDF en Artifacts Téléchargeables
        uses: actions/upload-artifact@v4
        with:
          name: candidatures-pdf
          path: candidatures/**/*.pdf
          retention-days: 30


