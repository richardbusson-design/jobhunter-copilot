name: JobHunter Copilot Cloud (Recherche & Candidatures 24h/24)

on:
  schedule:
    # Exécution automatique tous les jours à 07h00, 12h00 et 17h00 UTC (09h, 14h, 19h heure de Paris)
    - cron: '0 7,12,17 * * *'
  workflow_dispatch: # Permet aussi de déclencher manuellement le robot depuis un smartphone ou un navigateur

jobs:
  jobhunter-run:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du Code
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installation des dépendances et de Chromium Headless
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y chromium-browser fonts-liberation fonts-dejavu

      - name: 🛡️ Exécution des Tests de Sécurité QualityGuard
        run: |
          python -m unittest discover tests

      - name: 🚀 Lancement du Pipeline JobHunter Cloud (Recherche & Génération PDF)
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python src/cloud_runner.py

      - name: 💾 Sauvegarde des Nouvelles Candidatures
        run: |
          git config --global user.name "JobHunter Cloud Bot"
          git config --global user.email "bot@kairos-paye.fr"
          git add candidatures/ tracker.json dashboard.md
          git commit -m "🤖 [Cloud Bot] Nouvelles candidatures générées $(date +'%Y-%m-%d %H:%M')" || echo "Aucune nouvelle candidature à commiter"
          git push || echo "Pas de modifications distantes"

      - name: 📎 Sauvegarde des Fichiers PDF en Artifacts Téléchargeables
        uses: actions/upload-artifact@v4
        with:
          name: candidatures-pdf
          path: candidatures/**/*.pdf
          retention-days: 30
